about_content: |
  Hi, I'm Muhammad Ehssan — an AI Full Stack Engineer based in Lahore, Pakistan with 4+ years building and scaling production backend services, REST APIs, and React applications.

  **What I bring:**
  - **Backend & Systems** — Migrated 15+ services to microservices, cut API latency by 35%, and automated pipelines processing 100,000+ records monthly with zero manual intervention.
  - **AI & LLM** — Shipped LLM-powered features and RAG-style retrieval pipelines in production, including an AI resume-ranking system that cut recruiter effort by 80%.
  - **Full-Stack Delivery** — Delivered platforms serving 30,000+ users end-to-end, from database to mobile app, with real-time features and AI analytics.

  Core expertise: <mark>Node.js</mark> · <mark>Spring Boot</mark> · <mark>PostgreSQL</mark> · <mark>Microservices</mark> · <mark>LLM Integration</mark> · <mark>RAG Pipelines</mark> · <mark>AWS</mark>

  Currently exploring <mark>agentic AI systems</mark> and <mark>multi-step LLM pipelines</mark>.

  Open to senior/lead backend or AI engineering roles — reach me at **ehsanghazanfar2@gmail.com**.

